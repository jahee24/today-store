name: Frontend CI

on:
  push:
    paths:
      - 'frontend-app/frontend/**'
      - '.github/workflows/frontend-*.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'frontend-app/frontend/**'
      - '.github/workflows/frontend-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend_ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-app/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set up JDK for Android build
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install Flutter SDK
      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Run unit/widget tests
      - name: Run tests
        run: flutter test

      # Build debug APK to validate Android build pipeline
      - name: Build debug APK for verification
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://dev.example.local
