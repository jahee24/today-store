name: Backend CI

on:
  push:
    paths:
      - 'backend-spring/**'
      - '.github/workflows/backend-*.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'backend-spring/**'
      - '.github/workflows/backend-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set up JDK for Spring Boot build
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Enable Gradle cache and build optimizations
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Run backend tests and create executable jar
      - name: Build and test with Gradle
        working-directory: backend-spring/today-store
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test bootJar

      # Verify Docker image
      - name: Docker build test
        run: docker build -t backend-ci-test:latest backend-spring/today-store

      # Scan Docker image for HIGH/CRITICAL vulnerabilities
      - name: Trivy security scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: backend-ci-test:latest
          version: v0.69.3
          format: table
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
