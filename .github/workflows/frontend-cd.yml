name: Frontend CD

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'frontend-app/frontend/**'
      - '.github/workflows/frontend-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_upload:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-app/frontend

    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      build_mode: ${{ steps.build.outputs.build_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set up JDK for Android build
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install Flutter SDK
      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Build APK and expose artifact metadata
      - name: Build APK
        id: build
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"

          # Route build mode/output by branch (main=release, others=debug).
          if [ "$BRANCH_NAME" = "main" ]; then
            BUILD_MODE="release"
            API_BASE_URL="${{ secrets.FRONTEND_API_URL_PROD }}"
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          else
            BUILD_MODE="debug"
            API_BASE_URL="${{ secrets.FRONTEND_API_URL_DEV }}"
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          fi

          # Fail fast if required API URL secret is missing.
          if [ -z "$API_BASE_URL" ]; then
            echo "Missing API URL secret for branch: $BRANCH_NAME" >&2
            exit 1
          fi

          # Build APK with branch-specific mode and API URL.
          flutter build apk --"$BUILD_MODE" --dart-define=API_BASE_URL="$API_BASE_URL"

          # Validate expected APK file exists.
          if [ ! -f "$APK_PATH" ]; then
            echo "APK output not found: $APK_PATH" >&2
            exit 1
          fi

          # Export metadata for upload/notification steps.
          echo "build_mode=$BUILD_MODE" >> "$GITHUB_OUTPUT"
          echo "artifact_name=frontend-apk-${BRANCH_NAME}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # Upload generated APK to GitHub Actions artifacts
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: frontend-app/frontend/${{ steps.build.outputs.artifact_path }}
          retention-days: 14
          if-no-files-found: error

  notify_slack:
    runs-on: ubuntu-latest
    needs:
      - build_and_upload
    if: always()
  
    steps:
      # Send workflow result to Slack channel
      - name: Send Slack notification
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build_and_upload.result }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: ${{ needs.build_and_upload.outputs.artifact_name }}
          BUILD_MODE: ${{ needs.build_and_upload.outputs.build_mode }}
        run: |
          # Skip when webhook is not configured.
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set. Skipping notification."
            exit 0
          fi
  
          # Select message style by workflow result.
          if [ "$BUILD_RESULT" = "success" ]; then
            STATUS_TEXT="SUCCESS"
            COLOR="#2eb886"
          else
            STATUS_TEXT="FAILED"
            COLOR="#e01e5a"
          fi
  
          # Build payload body.
          PAYLOAD=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "${COLOR}",
                "text": "*Frontend CD ${STATUS_TEXT}*\\nRepository: ${GITHUB_REPOSITORY}\\nBranch: ${BRANCH_NAME}\\nBuild mode: ${BUILD_MODE}\\nArtifact: ${ARTIFACT_NAME}\\nCommit: ${COMMIT_SHA}\\nRun: ${RUN_URL}"
              }
            ]
          }
          EOF
          )
  
          # Send payload to Slack webhook.
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
