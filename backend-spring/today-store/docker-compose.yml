services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: testrun
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testrun"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testrun?sslmode=disable
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: testdb
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      GCS_BUCKET: today-store-dev-user-uploads
      GCS_PREFIX: uploads/
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/gcp-sa.json
    volumes:
      - ./secrets/gcp-sa.json:/app/secrets/gcp-sa.json:ro
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
