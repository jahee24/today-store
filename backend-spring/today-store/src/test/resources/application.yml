spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
  ai:
    model:
      chat: none

server:
  port: 0

app:
  gcs:
    bucket: test-bucket
    prefix: uploads/
