spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate # update, none, validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  
  ai:
    model:
      chat: none

server:
  port: ${PORT:8080}

app:
  gcs:
    bucket: ${GCS_BUCKET}
    prefix: ${GCS_PREFIX:uploads/}
    signed-url-enabled: ${SIGNED_URL_ENABLED:false}
    signed-url-duration-minutes: ${SIGNED_URL_DURATION_MINUTES:15}