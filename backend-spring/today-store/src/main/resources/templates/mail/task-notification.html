<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Notification</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        .header { border-bottom: 2px solid #f4f4f4; padding-bottom: 10px; margin-bottom: 20px; }
        .status-success { color: #28a745; font-weight: bold; }
        .status-error { color: #dc3545; font-weight: bold; }
        .footer { margin-top: 30px; font-size: 0.8em; color: #777; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>안녕하세요!</h2>
    </div>
    <p>요청하신 <strong><span th:text="${taskType}">VARIATION</span></strong> 작업이 완료되었습니다.</p>
    <p>요청 시각: <span th:text="${submittedAt}">2024-05-10 14:30:00</span></p>

    <div>
        작업 상태:
        <span th:if="${status == 'SUCCESS'}" class="status-success">성공</span>
        <span th:if="${status == 'ERROR'}" class="status-error">실패</span>
    </div>

    <div th:if="${status == 'ERROR'}">
        <p>실패 사유: <span th:text="${errorMessage}">알 수 없는 오류</span></p>
    </div>

    <p th:if="${status == 'SUCCESS'}">
        지금 바로 결과를 확인해 보세요!
    </p>

    <div th:if="${status == 'SUCCESS' and resultImageUrls != null and !resultImageUrls.isEmpty()}" style="margin-top: 20px;">
        <p><strong>생성된 결과 이미지:</strong></p>
        <table style="width: 100%; border-collapse: separate; border-spacing: 5px;">
            <tr th:each="rowIdx : ${#numbers.sequence(0, 1)}">
                <td th:each="colIdx : ${#numbers.sequence(0, 3)}"
                    th:with="index=${rowIdx * 4 + colIdx}"
                    style="width: 25%; text-align: center; vertical-align: top;">
                    <img th:if="${index < resultImageUrls.size()}"
                         th:src="${resultImageUrls[index]}"
                         alt="Result Image"
                         style="width: 100%; max-width: 130px; height: auto; border-radius: 8px; border: 1px solid #eee; display: block; margin: 0 auto;"/>
                </td>
            </tr>
        </table>
    </div>

    <div class="footer">
        본 메일은 시스템에 의해 자동 발송되었습니다.
    </div>
</div>
</body>
</html>
