name: fronted
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
    
  # 상태 관리
  flutter_riverpod: ^2.5.1

  # HTTP
  dio: ^5.4.0

  # 라우팅
  go_router: ^14.0.0

  # 로컬 저장소
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # 이미지
  image_picker: ^1.0.4
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.0
  permission_handler: ^11.3.1

  # JSON 자동 생성
  json_annotation: ^4.8.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  build_runner:
  json_serializable:
  hive_generator:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKR-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#4F46E5"

  android_12:
    color: "#4F46E5"

  android: true
  ios: true
  web: false