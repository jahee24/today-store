name: fronted
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  google_sign_in: ^6.2.1
  kakao_flutter_sdk_user: ^1.9.5

  # 상태 관리
  flutter_riverpod: ^2.5.1

  # HTTP
  dio: ^5.4.0

  # 라우팅
  go_router: ^14.0.0

  # 로컬 저장소
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # 이미지
  image_picker: ^1.0.4
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.0
  permission_handler: ^11.3.1
  gal: ^2.3.0

  # JSON 자동 생성
  json_annotation: ^4.8.1
  cupertino_icons: ^1.0.8

  flutter_naver_map: ^1.4.4
  geolocator: ^13.0.2
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  build_runner:
  json_serializable:
  hive_generator:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6
  image: ^4.5.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png
    - assets/images/app_logo_large.png
    - assets/images/app_logo_login.png

  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKR-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_logo.png

flutter_native_splash:
  color: "#FFFFFF"
  # Android 11 이하 / iOS: 전체 로고 (원형 아님)
  image: assets/images/app_logo_splash.png
  android_gravity: center
  ios_content_mode: scaleAspectFit
  android: true
  ios: true
  web: false
  # Android 12+: 중앙만 원형(일러스트), 하단 branding 없음
  android_12:
    color: "#FFFFFF"
    image: assets/images/app_logo_splash.png
    icon_background_color: "#FFFFFF"
